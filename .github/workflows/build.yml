name: Build

# Manual or on a version tag only: macOS minutes cost 10x, so this
# shouldn't fire on every push.
on:
  workflow_dispatch:
  push:
    tags: ["*"]

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v7
        with: { name: web, path: build/web, retention-days: 14 }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - run: mkdir -p out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/tiny-week-zine.apk
      - uses: actions/upload-artifact@v7
        with: { name: android, path: out, retention-days: 14 }

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: build/linux/x64/release/bundle, retention-days: 14 }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: build/windows/x64/runner/Release, retention-days: 14 }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: "build/macos/Build/Products/Release/Tiny Week Zine.app", retention-days: 14 }

  # Pushes every build to itch.io with butler. Needs a BUTLER_API_KEY secret
  # (itch.io > Settings > API keys) and an ITCH_GAME variable such as
  # "yourname/tiny-week-zine". Skipped until both exist.
  itch:
    needs: [web, android, linux, windows, macos]
    if: ${{ vars.ITCH_GAME != '' }}
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { path: dist }
      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Push channels
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          for ch in web android linux windows; do
            ./butler/butler push "dist/$ch" "${{ vars.ITCH_GAME }}:$ch" --userversion "$v"
          done
          mkdir -p mac && mv dist/macos "mac/Tiny Week Zine.app"
          ./butler/butler push mac "${{ vars.ITCH_GAME }}:mac" --userversion "$v"

  # On a version tag, publish a GitHub release shaped for Obtainium: the tag is
  # exactly the pubspec version (no "v"), with exactly one APK attached.
  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match pubspec version
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != pubspec $v"; exit 1; }
      - uses: actions/download-artifact@v7
        with: { name: android, path: out }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" out/tiny-week-zine.apk \
            --title "Tiny Week Zine $GITHUB_REF_NAME" \
            --notes "$(git log -1 --pretty=%s)"
