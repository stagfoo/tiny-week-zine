name: Build

# Manual or on a version tag only: macOS minutes cost 10x, so this
# shouldn't fire on every push.
on:
  workflow_dispatch:
  push:
    tags: ["*"]

env:
  FLUTTER_VERSION: "3.47.0"

# Every build job leaves one ready-to-ship file in out/. Linux and macOS are
# tarred before upload because upload-artifact drops the executable bit.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build web --release --no-web-resources-cdn
      - run: mkdir out && (cd build/web && zip -qr ../../out/tiny-week-zine-web.zip .)
      - uses: actions/upload-artifact@v7
        with: { name: web, path: out, retention-days: 14 }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - run: mkdir out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/tiny-week-zine.apk
      - uses: actions/upload-artifact@v7
        with: { name: android, path: out, retention-days: 14 }

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build linux --release
      - run: |
          mkdir out
          cp -r build/linux/x64/release/bundle tiny-week-zine
          tar -czf out/tiny-week-zine-linux-x64.tar.gz tiny-week-zine
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: out, retention-days: 14 }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release tiny-week-zine
          Compress-Archive -Path tiny-week-zine -DestinationPath out/tiny-week-zine-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: out, retention-days: 14 }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter build macos --release
      - run: |
          mkdir out
          tar -czf out/tiny-week-zine-macos.tar.gz -C build/macos/Build/Products/Release "Tiny Week Zine.app"
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: out, retention-days: 14 }

  # On a version tag, publish a GitHub release with every build attached.
  # Shaped for Obtainium: the tag is exactly the pubspec version (no "v"),
  # and there is exactly one .apk (Obtainium ignores the other files).
  release:
    needs: [web, android, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match pubspec version
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != pubspec $v"; exit 1; }
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Tiny Week Zine $GITHUB_REF_NAME" \
            --notes "$(git log -1 --pretty=%s)"

  # Pushes every build to itch.io with butler. Needs a BUTLER_API_KEY secret
  # (itch.io > Settings > API keys) and an ITCH_GAME variable such as
  # "yourname/tiny-week-zine". Skipped until ITCH_GAME exists.
  itch:
    needs: [web, android, linux, windows, macos]
    if: ${{ vars.ITCH_GAME != '' }}
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { path: dist }
      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Unpack into folders butler can diff
        run: |
          mkdir -p ch/web ch/android ch/windows ch/linux ch/mac
          unzip -q dist/web/*.zip -d ch/web
          cp dist/android/*.apk ch/android/
          unzip -q dist/windows/*.zip -d ch/windows
          tar -xzf dist/linux/*.tar.gz -C ch/linux
          tar -xzf dist/macos/*.tar.gz -C ch/mac
      - name: Push channels
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          for c in web android windows linux mac; do
            ./butler/butler push "ch/$c" "${{ vars.ITCH_GAME }}:$c" --userversion "$v"
          done
